kind = "web"
previewPath = "/"
title = "PharmaFlow Billing"
description = "A clean billing and inventory workspace for a family pharmacy business, with daily sales visibility, quick invoice creation, product stock tracking, and price management."
version = "1.0.0"
id = "artifacts/pharma-billing"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20029

[services.development]
run = "pnpm --filter @workspace/pharma-billing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pharma-billing", "run", "build" ]
serve = "static"
publicDir = "artifacts/pharma-billing/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20029"
BASE_PATH = "/"
